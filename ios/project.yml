# XcodeGen spec. On a Mac:  brew install xcodegen && cd ios && xcodegen && open AgentConsole.xcodeproj
name: AgentConsole
options:
  bundleIdPrefix: com.apumutyala
  deploymentTarget:
    iOS: "26.0"                         # BGContinuedProcessingTask is iOS/iPadOS 26+
packages:
  MLXSwiftLM:
    # mlx-swift-lm 3.33.0 + PR #821 (Inkling 2), vendored at aleroot/mlx-swift-lm@5507b3b with
    # two small loader patches; see Vendor/mlx-swift-lm/VENDORED.md. Needs Xcode 26.4+.
    # Depends on mlx-swift .upToNextMinor(from: "0.33.0"), same as the 3.33.0 release.
    path: Vendor/mlx-swift-lm
  MLXSwift:
    # Same package mlx-swift-lm 3.33.0 pins (.upToNextMinor(from: "0.33.0")),
    # declared directly for MLXNN/MLXOptimizers (on-device LoRA training).
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.33.0
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.4.0                         # LFM3 tokenizer needs BPE ignore_merges + code-point regex splits (#397, #398)
  Xybrid:                               # on-device STT/TTS only (whisper.cpp + Kokoro/ONNX)
    url: https://github.com/xybrid-ai/xybrid
    exactVersion: 0.21.0
targets:
  AgentConsole:
    type: application
    platform: iOS
    scheme: {}                          # shared scheme so `xcodebuild -scheme` works in CI
    sources: [AgentConsole]
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXVLM                 # Inkling 2 (inkling2_loop) loads through VLMModelFactory
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: MLXSwiftLM
        product: MLXEmbedders               # memory: optional LFM2.5-Embedding-350M
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: MLXSwift
        product: MLXOptimizers
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: Xybrid
        product: Xybrid
    entitlements:
      path: AgentConsole/AgentConsole.entitlements
      properties:
        # Background GPU Access capability (needed to keep MLX on the GPU in a BGContinuedProcessingTask)
        com.apple.developer.background-tasks.continued-processing.gpu: true
        # LLM weights need more than the default jetsam limit (same as Apple's LLMEval)
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: AgentConsole/Info.plist
      properties:
        CFBundleDisplayName: Agent Console
        AppGitSHA: $(APP_GIT_SHA)       # benchmark receipts record the build; CI passes APP_GIT_SHA=$GITHUB_SHA
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).summarize.*
        NSMicrophoneUsageDescription: Push-to-talk transcribes your voice on device to send to the agent.
        NSCameraUsageDescription: Scans the pairing QR code shown by your worker so you do not have to type its token.
        NSLocalNetworkUsageDescription: Connects to your job worker on the local network.
        NSAppTransportSecurity:
          # Allows http:// to IPs and .local names (e.g. a Tailscale 100.x address).
          # For anything else, put the worker behind HTTPS (e.g. `tailscale serve`).
          NSAllowsLocalNetworking: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        APP_GIT_SHA: unknown            # overridden on the xcodebuild command line in CI
