name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Worker + bridge tests
        working-directory: worker
        run: |
          pip install mcp
          python -m unittest -v test_jobworker test_mcp_bridge test_models
      - name: Expert repack tests
        working-directory: tools
        run: |
          pip install numpy
          python -m unittest -v test_expert_repack

  ios:
    # Apple silicon runner with real Xcode, so MLX's Metal shaders compile.
    runs-on: macos-26   # Xcode 26.6 (mlx-swift-lm 3.33 needs Swift 6.3 tools)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26+
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26+ on this image (iOS 26 SDK needed)"; exit 1; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Metal toolchain (separate download since Xcode 26)
        run: xcodebuild -downloadComponent MetalToolchain || echo "already present or not needed"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ios/build/SourcePackages
          key: spm-${{ hashFiles('ios/project.yml') }}

      - name: Build (unsigned, device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project AgentConsole.xcodeproj -scheme AgentConsole \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Errors summary
        if: failure()
        working-directory: ios
        run: grep -E "error:" build.log | sort -u | head -100 || true

      - name: Package IPA (ad-hoc signed with entitlements; re-sign on install)
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/AgentConsole.app
          codesign --force --sign - --entitlements AgentConsole/AgentConsole.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry AgentConsole.ipa Payload
          ls -lh AgentConsole.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AgentConsole-ipa
          path: ios/AgentConsole.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7
